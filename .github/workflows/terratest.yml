# Terratest — nightly integration tests for Blueprint 02 (AWS EC2 – Single Node).
#
# Runs on a schedule (Mon / Wed / Fri at 02:00 UTC) and on manual dispatch.
# Each sub-test (one per OS type) provisions a real EC2 environment in AWS,
# verifies cloud-init, Docker, SSM Agent, iptables, and the aidome-ops user,
# and destroys all resources on exit.
#
# Required repository/environment secrets and variables:
#   TERRATEST_AWS_ROLE_ARN   — IAM role ARN to assume via OIDC for tests
#                              (needs ec2:*, iam:*, ssm:SendCommand, etc.)
#   TEST_AWS_REGION          — Optional override for the AWS region (default: us-east-1)
#
# The workflow uses OIDC (no long-lived credentials) to assume the test role.
# See docs/security-guidelines.md for the minimal IAM policy to attach.

name: Terratest – Blueprint 02

on:
  schedule:
    # Mon, Wed, Fri at 02:00 UTC — off-peak to minimise cost impact.
    - cron: "0 2 * * 1,3,5"
  workflow_dispatch:
    inputs:
      os_filter:
        description: "Run only the named OS test (e.g. ubuntu-2404). Leave blank for all."
        required: false
        default: ""
      aws_region:
        description: "AWS region override (default: us-east-1)"
        required: false
        default: "us-east-1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for OIDC AWS credential exchange

jobs:
  terratest:
    name: Integration test — Blueprint 02
    runs-on: ubuntu-latest
    timeout-minutes: 75 # four parallel OS tests × ~30 min each + overhead

    env:
      TEST_AWS_REGION: ${{ inputs.aws_region || 'us-east-1' }}
      TF_IN_AUTOMATION: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # -----------------------------------------------------------------------
      # Toolchain setup
      # -----------------------------------------------------------------------

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: blueprints/02-aws-ec2/test/go.mod
          cache: true
          cache-dependency-path: blueprints/02-aws-ec2/test/go.sum

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.3"
          # Disable the wrapper so Terraform output is raw (Terratest reads it directly).
          terraform_wrapper: false

      # -----------------------------------------------------------------------
      # AWS credentials via OIDC (no long-lived keys)
      # -----------------------------------------------------------------------

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.TERRATEST_AWS_ROLE_ARN }}
          aws-region: ${{ env.TEST_AWS_REGION }}

      # -----------------------------------------------------------------------
      # Run Terratest
      # -----------------------------------------------------------------------

      - name: go mod download
        working-directory: blueprints/02-aws-ec2/test
        run: go mod download

      - name: Run Terratest
        working-directory: blueprints/02-aws-ec2/test
        env:
          TEST_AWS_REGION: ${{ env.TEST_AWS_REGION }}
        run: |
          FILTER="${{ inputs.os_filter }}"
          if [[ -n "$FILTER" ]]; then
            RUN_ARG="-run TestBlueprint02/${FILTER}"
          else
            RUN_ARG="-run TestBlueprint02"
          fi

          go test -v $RUN_ARG \
            -timeout 65m \
            -parallel 4 \
            ./...
