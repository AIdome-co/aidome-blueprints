#cloud-config
#
# AIdome VMware vSphere Cloud-Init Configuration
# ================================================
# This cloud-init configuration sets up a secure VMware vSphere VM for AIdome with:
# - Hardened SSH configuration (port 22)
# - Fail2ban intrusion prevention
# - iptables firewall
# - Docker Engine installation (via official APT repository)
# - open-vm-tools for VMware Guest operations
# - Dedicated non-root operator account (aidome-ops)
# - Unattended security upgrades
#
# After boot, connect via SSH and run the AIdome installer
# (obtain the URL from your AIdome account or support team).
#
# References:
# - https://cloudinit.readthedocs.io/
# - https://docs.docker.com/engine/install/ubuntu/
# - https://docs.docker.com/engine/install/debian/
#
# Version: 1.0 (Ubuntu 24.04 LTS)
# ================================================

preserve_hostname: false
hostname: aidome-vsphere
fqdn: aidome-vsphere.local
ssh_pwauth: false

# Timezone configuration
timezone: UTC

# Explicit operator account — do NOT rely on the cloud provider's default user alone
users:
  - default
  - name: aidome-ops
    gecos: AIdome Operator
    groups: [sudo, docker, adm]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    # Inject SSH public key via ssh_authorized_keys or via Terraform templatefile variable
    # ssh_authorized_keys:
    #   - ssh-ed25519 AAAA...

# APT configuration
apt:
  preserve_sources_list: true
  conf: |
    APT::Periodic::Update-Package-Lists "1";
    APT::Periodic::Unattended-Upgrade "1";
    APT::Install-Recommends "false";
    APT::Get::Assume-Yes "true";
    Dpkg::Options::="--force-confdef";
    Dpkg::Options::="--force-confold";

# Boot commands — run before cloud-init modules (best practice for critical setup)
bootcmd:
  - [cloud-init-per, instance, mkdir-iptables, mkdir, -p, /etc/iptables]
  - [cloud-init-per, instance, set-noninteractive, sh, -c, 'echo "debconf debconf/frontend select Noninteractive" | debconf-set-selections']
  - [cloud-init-per, instance, debconf-v4, sh, -c, "echo 'iptables-persistent iptables-persistent/autosave_v4 boolean false' | debconf-set-selections"]
  - [cloud-init-per, instance, debconf-v6, sh, -c, "echo 'iptables-persistent iptables-persistent/autosave_v6 boolean false' | debconf-set-selections"]

# Package management
package_update: true
package_upgrade: true

# Packages to install
packages:
  - vim
  - curl
  - htop
  - wget
  - ca-certificates
  - gnupg
  - lsb-release
  - python3
  - git
  - net-tools
  - dnsutils
  - iproute2
  - traceroute
  - mtr
  - iptables-persistent
  - netfilter-persistent
  - fail2ban
  - unattended-upgrades
  - jq
  - unzip
  - auditd
  - audispd-plugins
  - open-vm-tools

write_files:
  # SSH hardening — port 22 only (customers may change this after setup)
  - path: /etc/ssh/sshd_config.d/60-aidome-hardening.conf
    permissions: "0644"
    owner: root:root
    content: |
      Port 22
      AddressFamily any

      # Authentication
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no
      UsePAM yes

      # Security hardening
      MaxAuthTries 3
      MaxSessions 10
      LoginGraceTime 60
      ClientAliveInterval 300
      ClientAliveCountMax 2

      # Disable insecure features
      PermitEmptyPasswords no
      X11Forwarding no
      PrintMotd no
      PrintLastLog yes
      TCPKeepAlive yes
      Compression no
      AllowTcpForwarding no
      AllowAgentForwarding no
      GatewayPorts no
      PermitTunnel no

      # CIS 5.2.18 — display /etc/issue.net before authentication
      Banner /etc/issue.net

      # CIS 5.2.5 — verbose auth logging captures detailed failed-auth information
      LogLevel VERBOSE

      # CIS 5.2.17 — restrict SSH logins to the designated operator account only
      AllowUsers aidome-ops

  # System banner for SSH connections
  - path: /etc/issue.net
    permissions: "0644"
    owner: root:root
    content: |
      ******************************************************************
      *                   AIdome VMware vSphere System                 *
      *                                                                *
      *  WARNING: Unauthorized access is prohibited and will be       *
      *  prosecuted to the full extent of the law.                    *
      *                                                                *
      *  All activities on this system are monitored and logged.      *
      ******************************************************************

  # MOTD
  - path: /etc/motd
    permissions: "0644"
    owner: root:root
    content: |

      Welcome to AIdome VMware vSphere
      ==================================

      System Information:
      - Hostname: aidome-vsphere
      - Docker: Docker Engine (rootful)
      - VMware Tools: open-vm-tools

      Quick Start — install AIdome:
      1. Connect via SSH
      2. Run the AIdome installer (obtain the URL from your AIdome account or support team):
         curl -fsSL https://<your-aidome-download-url>/aidome.sh | sudo bash
      3. Check Docker: docker ps
      4. Check firewall rules: sudo iptables -L -n

      Documentation: See /var/log/cloud-init.log

  # Sysctl security hardening
  - path: /etc/sysctl.d/99-aidome-security.conf
    permissions: "0644"
    owner: root:root
    content: |
      # Security Configuration

      # IP Forwarding — disabled by default; uncomment only if VPN/routing is required
      # net.ipv4.ip_forward = 1
      # net.ipv6.conf.all.forwarding = 1

      # Network security
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.secure_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      net.ipv4.icmp_ignore_bogus_error_responses = 1

      # Log martian packets (CIS 3.3.7)
      net.ipv4.conf.all.log_martians = 1
      net.ipv4.conf.default.log_martians = 1

      # IPv6 security
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv6.conf.default.accept_source_route = 0
      # Disable IPv6 router advertisements (CIS 3.3.10)
      net.ipv6.conf.all.accept_ra = 0
      net.ipv6.conf.default.accept_ra = 0

      # TCP hardening
      net.ipv4.tcp_syncookies = 1
      net.ipv4.tcp_max_syn_backlog = 2048
      net.ipv4.tcp_synack_retries = 2
      net.ipv4.tcp_syn_retries = 5

      # Kernel security
      kernel.dmesg_restrict = 1
      kernel.kptr_restrict = 2
      kernel.yama.ptrace_scope = 1

      # File system security
      fs.suid_dumpable = 0
      fs.protected_hardlinks = 1
      fs.protected_symlinks = 1

      # Address Space Layout Randomization — prevents memory-based exploits (CIS 1.5.2)
      kernel.randomize_va_space = 2

  # Fail2ban jail for SSH on port 22
  - path: /etc/fail2ban/jail.d/aidome-sshd.local
    permissions: "0644"
    owner: root:root
    content: |
      [sshd]
      enabled  = true
      port     = 22
      filter   = sshd
      logpath  = %(sshd_log)s
      maxretry = 5
      bantime  = 3600
      findtime = 600

      [DEFAULT]
      destemail = root@localhost
      sender = fail2ban@aidome-vsphere
      action = %(action_)s

  # CIS 4.1.x — auditd rules (compiled by augenrules on boot)
  # Covers: identity changes, login/logout, privileged commands, file deletion,
  # sudo usage, kernel module loading — the core CIS 4.1 controls.
  - path: /etc/audit/rules.d/99-aidome-cis.rules
    permissions: "0640"
    owner: root:root
    content: |
      ## CIS Ubuntu Linux 24.04 LTS Benchmark — Section 4.1 Audit Rules
      ## Generated by AIdome cloud-init; do not edit by hand.

      # Remove all existing rules
      -D

      # Set buffer size large enough to avoid lost events at boot
      -b 8192

      # Failure mode: 1=silent (log failure), 2=panic (kernel panic on overflow)
      -f 1

      # 4.1.2 — System date and time modification (clock manipulation is a log-tampering prerequisite)
      -a always,exit -F arch=b64 -S adjtimex -k time_change
      -a always,exit -F arch=b64 -S settimeofday -k time_change
      -a always,exit -F arch=b64 -S clock_settime -k time_change
      -w /etc/localtime -p wa -k time_change

      # 4.1.3 — Identity and credential management
      -w /etc/group   -p wa -k identity
      -w /etc/passwd  -p wa -k identity
      -w /etc/gshadow -p wa -k identity
      -w /etc/shadow  -p wa -k identity
      -w /etc/security/opasswd -p wa -k identity

      # 4.1.4 — Login/logout events
      -w /var/log/lastlog -p wa -k logins
      -w /var/run/faillock -p wa -k logins

      # 4.1.5 — Privileged command usage (setuid/setgid binaries)
      -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k setuid
      -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k setgid

      # 4.1.7 — File system modifications (delete, rename, chmod, chown)
      -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -k perm_mod
      -a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -k perm_mod
      -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat -k delete

      # 4.1.11 — Sudo/su usage and sudoers changes
      -w /etc/sudoers      -p wa -k sudoers
      -w /etc/sudoers.d/   -p wa -k sudoers
      -w /usr/bin/sudo     -p x  -k priv_esc
      -w /usr/bin/su       -p x  -k priv_esc

      # 4.1.15 — SSH authorized_keys changes
      -w /home/aidome-ops/.ssh -p wa -k authorized_keys

      # 4.1.6 — Network socket creation (IPv4 AF_INET=2, IPv6 AF_INET6=10)
      -a always,exit -F arch=b64 -S socket -F a0=2  -k network_socket_created
      -a always,exit -F arch=b64 -S socket -F a0=10 -k network_socket_created

      # 4.1.17 — Kernel module loading/unloading
      -w /sbin/insmod  -p x -k kernel_modules
      -w /sbin/rmmod   -p x -k kernel_modules
      -w /sbin/modprobe -p x -k kernel_modules
      -a always,exit -F arch=b64 -S init_module,delete_module -k kernel_modules

      # Make the configuration immutable — requires reboot to change rules
      -e 2

  # IPv4 firewall — SSH on port 22 + HTTPS from RFC1918
  - path: /etc/iptables/rules.v4
    permissions: "0640"
    owner: root:root
    content: |
      # Host-level defense-in-depth (VMware NSX or port group ACLs are the primary perimeter).
      # Restrict HTTPS inbound to RFC1918 private space.
      *filter
      :INPUT DROP [0:0]
      :FORWARD DROP [0:0]
      :OUTPUT ACCEPT [0:0]
      :DOCKER-USER - [0:0]

      # Allow loopback and established/related
      -A INPUT -i lo -j ACCEPT
      -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

      -A INPUT -p icmp --icmp-type echo-request -j ACCEPT

      # SSH on port 22
      -A INPUT -p tcp --dport 22 -j ACCEPT

      # HTTPS from RFC1918 private IPv4 ranges
      -A INPUT -s 10.0.0.0/8 -p tcp --dport 443 -j ACCEPT
      -A INPUT -s 172.16.0.0/12 -p tcp --dport 443 -j ACCEPT
      -A INPUT -s 192.168.0.0/16 -p tcp --dport 443 -j ACCEPT

      # DOCKER-USER chain -- Docker forwards traffic through FORWARD, not INPUT.
      # Rules here apply to container-published ports before Docker's own rules.
      # Allow only established/related and RFC1918 sources to reach containers.
      -A DOCKER-USER -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
      -A DOCKER-USER -s 10.0.0.0/8 -j RETURN
      -A DOCKER-USER -s 172.16.0.0/12 -j RETURN
      -A DOCKER-USER -s 192.168.0.0/16 -j RETURN
      -A DOCKER-USER -j DROP

      COMMIT

  # IPv6 firewall — SSH on port 22 + HTTPS from ULA space
  - path: /etc/iptables/rules.v6
    permissions: "0640"
    owner: root:root
    content: |
      *filter
      :INPUT DROP [0:0]
      :FORWARD DROP [0:0]
      :OUTPUT ACCEPT [0:0]

      # Allow loopback and established/related
      -A INPUT -i lo -j ACCEPT
      -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

      # SSH over IPv6 on port 22
      -A INPUT -p tcp --dport 22 -j ACCEPT

      # HTTPS over IPv6 from ULA space
      -A INPUT -s fc00::/7 -p tcp --dport 443 -j ACCEPT

      COMMIT

runcmd:
  - 'echo "### AIdome VMware vSphere Bootstrap Starting..."'
  - 'echo "Start time: $(date)"'

  # Apply sysctl
  - 'sysctl -p /etc/sysctl.d/99-aidome-security.conf || echo "Warning: sysctl failed"'

  # Disable UFW — iptables-persistent manages the firewall directly;
  # UFW conflicts with our rules.v4/rules.v6 if left enabled.
  - 'systemctl disable ufw --now 2>/dev/null || true'

  # Create critical directories early
  - 'mkdir -p /etc/iptables || echo "Warning: Failed to create /etc/iptables directory"'

  # SSH restart
  - sleep 2
  - 'systemctl restart ssh || systemctl restart sshd || echo "Warning: SSH restart failed"'
  - 'echo "SSH restarted on port 22"'

  # Fail2ban
  - 'systemctl enable fail2ban || true'
  - 'systemctl restart fail2ban || echo "Warning: fail2ban failed"'

  # Enable auditd — system-call audit daemon (CIS 4.1.x)
  - 'systemctl enable --now auditd || echo "Warning: auditd failed to start"'
  # Load audit rules from /etc/audit/rules.d/ (augenrules compiles all *.rules files)
  - 'augenrules --load 2>/dev/null || auditctl -R /etc/audit/rules.d/99-aidome-cis.rules 2>/dev/null || echo "Warning: audit rules failed to load (both augenrules and auditctl failed); run: systemctl status auditd && auditctl -l"'

  # Display system information
  - 'cat /etc/os-release || true'
  - 'echo "Kernel: $(uname -r)"'

  # Install Docker Engine via official APT repository (GPG-verified — no pipe-to-shell)
  - 'echo "Installing Docker Engine via official APT repository..."'
  - |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
      -o /tmp/docker-gpg-key.asc
    # Verify Docker GPG key fingerprint before trusting it
    gpg --show-keys --with-colons --fingerprint /tmp/docker-gpg-key.asc \
      | awk -F: '/^fpr:/ { print $10; exit }' \
      | grep -qx '9DC858229FC7DD38854AE2D88D81803C0EBFCD88' \
      || { echo "ERROR: Docker GPG key fingerprint mismatch"; exit 1; }
    gpg --dearmor < /tmp/docker-gpg-key.asc > /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
    rm -f /tmp/docker-gpg-key.asc
    echo \
      "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
      https://download.docker.com/linux/ubuntu \
      $(lsb_release -cs) stable" \
      > /etc/apt/sources.list.d/docker.list
    apt-get update -qq
    apt-get install -y docker-ce docker-ce-cli containerd.io \
      docker-buildx-plugin docker-compose-plugin \
      || echo "Warning: Docker install failed"
    systemctl enable --now docker.service docker.socket || true
    docker --version || true

  # Add aidome-ops user to docker group (if not already via users: block)
  - 'usermod -aG docker aidome-ops 2>/dev/null || true'

  # Ensure open-vm-tools is running
  - 'systemctl enable --now open-vm-tools || echo "Warning: open-vm-tools failed"'

  # Firewall
  - 'netfilter-persistent reload || echo "Warning: netfilter-persistent reload failed; verify rules with: iptables -L -n"'
  - 'systemctl enable netfilter-persistent || true'
  - 'echo "Firewall rules loaded and persisted"'

  # Cleanup
  - 'apt-get clean || true'
  - 'rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/* 2>/dev/null || true'

  # Status
  - 'echo "### Bootstrap Summary"'
  - 'echo "Hostname: $(hostname)"'
  - 'echo "Docker status: $(systemctl is-active docker || echo inactive)"'
  - 'echo "Fail2ban status: $(systemctl is-active fail2ban || echo inactive)"'
  - 'echo "auditd status: $(systemctl is-active auditd || echo inactive)"'
  - 'echo "Firewall status: $(systemctl is-active netfilter-persistent || echo inactive)"'
  - 'echo "VMware Tools: $(vmware-toolbox-cmd -v 2>/dev/null || echo not-available)"'
  - 'echo "End time: $(date)"'
  - 'echo "### Cloud-init completed. Instance is ready."'
  - 'echo "### Connect via SSH, then run the AIdome installer (obtain URL from your AIdome account or support team)."'

final_message: "AIdome VMware vSphere setup completed at $TIMESTAMP after $UPTIME seconds. Connect and run aidome.sh to install AIdome."

# Reboot the VM after cloud-init completes to ensure all kernel/network settings are applied
power_state:
  delay: 1
  mode: reboot
  message: "Rebooting to complete AIdome VMware vSphere setup..."
  timeout: 30
  condition: true
