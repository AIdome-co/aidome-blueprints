#cloud-config
# ---------------------------------------------------------------------------
# AIdome EC2 Preparation — cloud-init
#
# This cloud-config handles OS-level preparation so the machine is ready for
# AIdome product installation.  It does NOT install the product itself.
# ---------------------------------------------------------------------------

# ── System packages ────────────────────────────────────────────────────────

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - unzip
  - jq
  - net-tools
  - htop
  - fail2ban

# ── Users ──────────────────────────────────────────────────────────────────

users:
  - default
  - name: aidome
    gecos: AIdome Service Account
    groups: [docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true

# ── Disk setup (data volume at /dev/xvdf → /data) ─────────────────────────

disk_setup:
  /dev/xvdf:
    table_type: gpt
    layout: true
    overwrite: false

fs_setup:
  - label: aidome-data
    filesystem: ext4
    device: /dev/xvdf
    partition: auto
    overwrite: false

mounts:
  - ["/dev/xvdf", "/data", "ext4", "defaults,nofail", "0", "2"]

# ── Write configuration files ─────────────────────────────────────────────

write_files:
  # Sysctl tuning
  - path: /etc/sysctl.d/99-aidome.conf
    permissions: "0644"
    content: |
      # -- Network --
      net.core.somaxconn = 65535
      net.ipv4.tcp_max_syn_backlog = 65535
      net.ipv4.ip_local_port_range = 1024 65535

      # -- Virtual memory --
      vm.max_map_count = 262144
      vm.swappiness = 10

      # -- File descriptors --
      fs.file-max = 1048576

  # Raise file-descriptor limits
  - path: /etc/security/limits.d/99-aidome.conf
    permissions: "0644"
    content: |
      *  soft  nofile  1048576
      *  hard  nofile  1048576

  # Docker daemon configuration
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "5"
        },
        "storage-driver": "overlay2",
        "live-restore": true
      }

# ── Run commands (execute in order) ────────────────────────────────────────

runcmd:
  # Apply sysctl
  - sysctl --system

  # Install Docker CE
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
    https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
    > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Enable & start Docker
  - systemctl enable docker
  - systemctl start docker

  # Prepare data directory structure
  - mkdir -p /data/aidome
  - chown -R aidome:aidome /data/aidome

  # Enable fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Signal completion
  - echo "cloud-init:aidome-prep-complete" > /run/cloud-init/aidome-ready

# ── Final message ─────────────────────────────────────────────────────────

final_message: "AIdome EC2 preparation finished in $UPTIME seconds."
